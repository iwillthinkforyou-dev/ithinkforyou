<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Support the Idea — I THINK FOR YOU</title>
  <meta name="description" content="Support I THINK FOR YOU and help keep the idea alive.">

  <link rel="icon" href="assets/brand/ITFY_FAVICON.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/ITFY_FAVICON_32X32.png">
<link rel="apple-touch-icon" href="assets/brand/ITFY_APPLE_TOUCH_ICON.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f8f6f1;
      color: #171717;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 28px 7%;
      border-bottom: 1px solid #e9e4da;
    }

    .brand {
      color: #171717;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    main {
      width: 100%;
      max-width: 620px;
      margin: auto;
      padding: 90px 24px 100px;
      text-align: center;
    }

    .eyebrow {
      color: #947b52;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      margin-bottom: 22px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(38px, 7vw, 54px);
      font-weight: 400;
      line-height: 1.15;
      margin: 0 0 24px;
    }

    .intro {
      color: #55514b;
      font-size: 15px;
      line-height: 1.9;
      max-width: 490px;
      margin: 0 auto 42px;
    }

    .payment-options {
      display: grid;
      gap: 14px;
      max-width: 390px;
      margin: 0 auto;
    }

    .payment-button {
      display: block;
      width: 100%;
      padding: 17px 24px;
      background: #171717;
      color: #fff;
      border: 1px solid #171717;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s, color 0.2s;
    }

    .payment-button:hover {
      background: transparent;
      color: #171717;
    }

    .closing {
      color: #777168;
      font-size: 12px;
      line-height: 1.8;
      margin-top: 34px;
    }

    footer {
      text-align: center;
      padding: 24px;
      border-top: 1px solid #e9e4da;
      color: #777168;
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      header {
        padding: 24px;
      }

      main {
        padding-top: 70px;
        padding-bottom: 75px;
      }
    }
    .support-header {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px 20px;
}

.support-header .brand {
  display: flex;
  justify-content: center;
  align-items: center;
}
  </style>
</head>

<body>

 <header class="support-header">
  <a class="brand" href="index.html" aria-label="I Think For You Home">
    <img src="assets/brand/ITFY_LOGO_COMPACT_LIGHT.svg"
         alt="I Think For You"
         style="height:100px;width:auto;display:block;">
  </a>
</header>

  <main>
    <div class="eyebrow">IF IT HELPED</div>

    <h1>Support the idea.</h1>

    <p class="intro">
      If this perspective helped you see your situation differently,
      you can support I THINK FOR YOU and help keep the idea alive.
    </p>

    <div class="payment-options">
      <a
        class="payment-button"
        href="https://www.paypal.com/ncp/payment/ADMZGSZSA9PAU"
        target="_blank"
        rel="noopener noreferrer">
        PayPal →
      </a>

      <a
        class="payment-button"
        href="https://u.payu.in/wr82lSns0Kb6"
        target="_blank"
        rel="noopener noreferrer">
        PayU →
      </a>
    </div>

    <p class="closing">
      Every contribution is appreciated.<br>
      Thank you for supporting I THINK FOR YOU.
    </p>
  </main>

  <footer>
    <a href="index.html">← Back to I THINK FOR YOU</a>
  </footer>

</body>
</html>
